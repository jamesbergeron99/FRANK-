<script>
    // [Keep all initialization, microphone, and splitIntoChunks logic exactly as provided]

    async function speak(fullText) {
        if (!audioCtx) return;
        stopCurrentAudio();

        // SPLIT INTO SECTIONS
        const rawSections = fullText.split(/(?=1\. FORENSIC|2\. THE REACTION|3\. LOG LINE|4\. WHAT'S WORKING|5\. THE AUDIT|6\. TOP 3 ISSUES|7\. FINAL VERDICT)/g);
        
        const chunks = [];
        for (const section of rawSections) {
            // THE CRITICAL BYPASS: Do not read the forensic list out loud.
            if (section.includes("FORENSIC SPELLING")) continue;
            
            if (section.trim().length < 2) continue;
            
            if (section.length > 500) {
                chunks.push(...splitIntoChunks(section));
            } else {
                chunks.push(section.trim());
            }
        }

        audioBuffers = {}; nextToPlay = 0;
        totalSections = chunks.length;
        isSequenceActive = true;
        const settingsResp = await fetch('/voice-settings');
        const settings = await settingsResp.json();

        chunks.forEach(async (chunk, index) => {
            try {
                const res = await fetch("https://api.inworld.ai/tts/v1/voice", {
                    method: "POST",
                    headers: { "Authorization": `Basic ${settings.apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        text: chunk.replace(/Logline/gi, 'Log line'), 
                        voiceId: "default-oglabcjnetcklcq7rghmbw__frank", 
                        modelId: "inworld-tts-1.5-max" 
                    })
                });
                const data = await res.json();
                if (!data.audioContent) return;
                audioBuffers[index] = await audioCtx.decodeAudioData(
                    Uint8Array.from(atob(data.audioContent), c => c.charCodeAt(0)).buffer
                );
                if (!isPlaying && isSequenceActive && index === 0) playSequentially();
            } catch (e) {}
        });
    }

    // [Keep playSequentially, stopCurrentAudio, and uploadFiles logic exactly as provided]
</script>
