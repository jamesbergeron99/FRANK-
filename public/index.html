<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drag & Drop PDF Merger</title>
    <!-- Load PDF-lib and SortableJS from CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        #fileList { margin: 1rem 0; padding: 1rem; border: 2px dashed #ccc; min-height: 50px; cursor: move; }
        .file-item { padding: 10px; margin: 5px 0; background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; display: flex; align-items: center; }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>PDF Merger</h1>
    <p>Select files, then <b>drag and drop</b> to reorder:</p>
    <input type="file" id="filePicker" multiple accept="application/pdf">
    
    <div id="fileList"></div>
    <button id="mergeBtn" style="display:none;">Merge & Download</button>

    <script>
        const { PDFDocument } = PDFLib;
        const filePicker = document.getElementById('filePicker');
        const fileListDiv = document.getElementById('fileList');
        const mergeBtn = document.getElementById('mergeBtn');
        
        // Store files in a Map so we can keep track of them by their ID/Name
        let fileMap = new Map();

        // Initialize SortableJS
        new Sortable(fileListDiv, { animation: 150 });

        filePicker.addEventListener('change', (e) => {
            fileListDiv.innerHTML = '';
            fileMap.clear();

            Array.from(e.target.files).forEach((file, index) => {
                const id = 'file-' + index;
                fileMap.set(id, file);

                const div = document.createElement('div');
                div.className = 'file-item';
                div.id = id;
                div.textContent = file.name;
                fileListDiv.appendChild(div);
            });
            mergeBtn.style.display = 'block';
        });

        mergeBtn.addEventListener('click', async () => {
            const mergedPdf = await PDFDocument.create();
            
            // Get the order from the DOM after user dragging
            const currentOrder = Array.from(fileListDiv.children).map(el => el.id);

            for (const id of currentOrder) {
                const file = fileMap.get(id);
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer);
                const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }

            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'merged.pdf';
            link.click();
        });
    </script>
</body>
</html>
