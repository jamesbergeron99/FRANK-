<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frank's Forensic Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card: #121212; }
        body { background: var(--bg); color: #eee; font-family: 'Segoe UI', serif; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        .header { padding: 15px; border-bottom: 2px solid var(--gold); background: #111; text-align: center; }
        h1 { margin: 0; font-style: italic; color: var(--gold); letter-spacing: 2px; font-size: 1.5rem; }
        .toggle-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; font-weight: bold; font-size: 0.8rem; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 2px; background-color: var(--gold); transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(24px); }
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; background: #080808; }
        .msg { max-width: 90%; padding: 25px; border-radius: 10px; line-height: 1.8; font-size: 1.1rem; white-space: pre-wrap; background: var(--card); border-left: 4px solid var(--gold); }
        .user-msg { align-self: flex-end; border-left: none; border-right: 4px solid var(--gold); background: #222; }
        .input-area { padding: 15px 30px; background: #111; border-top: 2px solid var(--gold); display: flex; gap: 15px; align-items: center; }
        .pill { flex-grow: 1; display: flex; background: #000; border: 1px solid var(--gold); border-radius: 40px; padding: 5px 20px; align-items: center; gap: 10px; }
        #textInput { flex-grow: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 1rem; }
        .icon-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.4rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FRANK'S PRIVATE OFFICE</h1>
        <div class="toggle-box">
            <span>FEATURE</span>
            <label class="switch"><input type="checkbox" id="modeToggle"><span class="slider"></span></label>
            <span>T.V. PILOT</span>
        </div>
    </div>
    <div id="chat-window"></div>
    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('scriptInput').click()"><i class="fas fa-file-upload"></i></button>
        <input type="file" id="scriptInput" accept=".pdf" style="display:none;" onchange="uploadFiles()">
        <div class="pill">
            <input type="text" id="textInput" placeholder="Consult Frank..." onkeypress="if(event.key==='Enter') sendBanter()">
        </div>
        <button class="icon-btn" onclick="sendBanter()"><i class="fas fa-paper-plane"></i></button>
        <button class="icon-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i></button>
    </div>
    <script>
        const chatWindow = document.getElementById('chat-window');
        const textInput = document.getElementById('textInput');
        let tvSeriesMemory = "";

        const welcomeText = "Ah — there you are. Come in, don't hover in the doorway. If you've brought me a script, I assume you're ready for the truth — or at least a version of it that's useful. I'm Frank. Not just in name — by temperament. I don't do vague encouragement, and I don't hand out gold stars for effort. What I do is take your script apart, figure out what's working, what's not, and tell you exactly where the engine is stalling. Upload your script. Give me a moment. And try not to flinch when I get to the good part.";

        window.onload = () => {
            localStorage.clear();
            addMessage(welcomeText);
        };

        document.getElementById('modeToggle').addEventListener('change', async function() {
            if (this.checked) {
                const response = await fetch('/tv-greeting', { method: 'POST' });
                const data = await response.json();
                addMessage(data.message);
            } else {
                addMessage("Ah, back to features. Let's see if you can tell a complete story in one sitting.");
            }
        });

        async function uploadFiles() {
            const fileInput = document.getElementById('scriptInput');
            if (fileInput.files.length === 0) return;
            addMessage('Analyzing... This takes a few moments, darling...', false);
            const mode = document.getElementById('modeToggle').checked ? 'T.V. Series' : 'Feature Film';
            const formData = new FormData();
            formData.append('mode', mode);
            formData.append('scripts', fileInput.files[0]);
            if (mode === 'T.V. Series') formData.append('memory', tvSeriesMemory);
            
            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();
                if (mode === 'T.V. Series' && data.memory) tvSeriesMemory = data.memory;
                addMessage(data.message);
            } catch (e) {
                addMessage("Frank is indisposed, darling.");
            }
        }

        function sendBanter() {
            const val = textInput.value.trim();
            if (!val) return;
            textInput.value = '';
            addMessage(val, true);
            fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: val }) })
                .then(r => r.json())
                .then(data => { addMessage(data.message); });
        }

        function addMessage(text, user = false) {
            const div = document.createElement('div');
            div.className = user ? 'msg user-msg' : 'msg';
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function downloadPDF() {
            const element = document.createElement('div');
            element.innerHTML = `<div style="padding:40px; background:#000; color:#fff; font-family:serif; line-height:1.6;">
                <h1 style="color:#d4af37; border-bottom:2px solid #d4af37;">FRANK'S PRIVATE AUDIT</h1>
                ${Array.from(document.querySelectorAll('.msg:not(.user-msg)')).map(m =>
                    `<p style="margin-bottom:20px; white-space:pre-wrap; border-left:3px solid #d4af37; padding-left:15px;">${m.innerText}</p>`
                ).join('')}
            </div>`;
            html2pdf().from(element).save('Frank_Audit.pdf');
        }
    </script>
</body>
</html>
