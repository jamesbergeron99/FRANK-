<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frank's Forensic Office</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card: #121212; }
        body { background: var(--bg); color: #eee; font-family: 'Segoe UI', serif; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        .header { padding: 15px; border-bottom: 2px solid var(--gold); background: #111; text-align: center; position: relative; }
        h1 { margin: 0; font-style: italic; color: var(--gold); letter-spacing: 2px; font-size: 1.5rem; }
        .toggle-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; font-weight: bold; font-size: 0.8rem; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 2px; background-color: var(--gold); transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(24px); }
        #memoryStatus { margin-top: 8px; font-size: 0.7rem; letter-spacing: 1.5px; color: #8a7327; text-transform: uppercase; }
        #memoryStatus.loaded { color: var(--gold); }
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; background: #080808; }
        .msg { max-width: 90%; padding: 25px; border-radius: 10px; line-height: 1.8; font-size: 1.1rem; white-space: pre-wrap; background: var(--card); border-left: 4px solid var(--gold); }
        .user-msg { align-self: flex-end; border-left: none; border-right: 4px solid var(--gold); background: #222; }
        .media-bar { background: #111; padding: 10px; display: flex; justify-content: center; border-top: 1px solid #333; }
        .media-btn { background: none; border: 1px solid var(--gold); color: var(--gold); width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        .input-area { padding: 15px 30px; background: #111; border-top: 2px solid var(--gold); display: flex; gap: 15px; align-items: center; }
        .pill { flex-grow: 1; display: flex; background: #000; border: 1px solid var(--gold); border-radius: 40px; padding: 5px 20px; align-items: center; gap: 10px; }
        #textInput { flex-grow: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 1rem; }
        .icon-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.4rem; }
        #micBtn.recording { color: #ff4444; }
        #micBtn.unavailable { color: #555; cursor: not-allowed; }
        .intent-btn { position: absolute; left: 20px; top: 25px; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.2s; }
        .intent-btn:hover { background: var(--gold); color: #111; }
        .intent-btn.set { background: rgba(212,175,55,0.15); }
        .clear-btn { position: absolute; right: 20px; top: 25px; background: none; border: 1px solid #ff4444; color: #ff4444; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.2s; }
        .clear-btn:hover { background: #ff4444; color: #fff; }
    </style>
</head>
<body onclick="initAudio()">
    <div class="header">
        <h1>FRANK'S PRIVATE OFFICE</h1>
        <div class="toggle-box">
            <span>FEATURE</span>
            <label class="switch"><input type="checkbox" id="modeToggle"><span class="slider"></span></label>
            <span>T.V. SERIES</span>
        </div>
        <div id="memoryStatus">Checking the filing cabinet...</div>
        <button class="intent-btn" id="intentBtn" onclick="setIntent()"><i class="fas fa-pen-nib"></i> YOUR INTENT</button>
        <button class="clear-btn" onclick="wipeMemory()"><i class="fas fa-trash-alt"></i> WIPEMEMORY</button>
    </div>
    <div id="chat-window"></div>
    <div class="media-bar"><button class="media-btn" id="playPauseBtn" onclick="togglePlayback()"><i class="fas fa-pause"></i></button></div>
    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('scriptInput').click()"><i class="fas fa-file-upload"></i></button>
        <input type="file" id="scriptInput" accept=".pdf" style="display:none;" onchange="uploadFiles()">
        <div class="pill">
            <input type="text" id="textInput" placeholder="Consult Frank..." onkeypress="if(event.key==='Enter') sendBanter()">
            <button class="icon-btn" id="micBtn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        </div>
        <button class="icon-btn" onclick="sendBanter()"><i class="fas fa-paper-plane"></i></button>
        <button class="icon-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i></button>
    </div>
    <script>
        const chatWindow = document.getElementById('chat-window');
        const textInput = document.getElementById('textInput');

        // --- SESSION IDENTITY -------------------------------------------------
        // One stable id per browser, kept forever. This is what lets the server
        // hand the same script and the same coverage history back on a return
        // visit. Do NOT clear localStorage on load — that was wiping the key.
        function getSessionId() {
            let id = null;
            try { id = localStorage.getItem('frankSessionId'); } catch (e) {}
            if (!id) {
                id = 'frank-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
                try { localStorage.setItem('frankSessionId', id); } catch (e) {}
            }
            return id;
        }
        const SESSION_ID = getSessionId();

        let audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        } catch(e) {
            console.warn("AudioContext unavailable:", e);
        }

        let audioBuffers = {}, nextToPlay = 0, isPlaying = false, currentSource = null, totalSections = 0, isSequenceActive = false;
        let waitStartTime = null; // tracks how long we've been stalled waiting on the current chunk
        const CHUNK_STALL_TIMEOUT_MS = 12000; // give up waiting on a single chunk after this long

        // Greeting for the mode you'd switch to, warmed up in advance so the
        // toggle stays instant even though the line is written fresh each time.
        const pendingGreetings = { feature: null, tv: null };

        const LAST_RESORT_GREETING = "Come in, sit down. Set the switch up top for feature or series, then hand me your pages and we'll find out what you've got.";

        async function fetchGreeting(mode, context) {
            try {
                const r = await fetch('/greeting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: SESSION_ID,
                        mode,
                        context,
                        hour: new Date().getHours(),
                        minute: new Date().getMinutes()
                    })
                });
                const d = await r.json();
                return (d && d.message) ? d.message : LAST_RESORT_GREETING;
            } catch (e) {
                return LAST_RESORT_GREETING;
            }
        }

        window.onload = async () => {
            initSpeechRecognition();
            refreshStatus();
            const holder = addMessage('Frank is looking up from his desk...');
            const text = await fetchGreeting('feature', 'arrival');
            holder.innerText = text;
            chatWindow.scrollTop = chatWindow.scrollHeight;
            preWarmGreeting(text);
            prefetchGreeting('tv');
        };

        // Tell Frank which choices are deliberate, once, and he stops guessing at
        // them on every pass. It is stored with the script and survives restarts.
        async function setIntent() {
            let current = '';
            try {
                const r = await fetch('/intent?sessionId=' + encodeURIComponent(SESSION_ID));
                current = (await r.json()).text || '';
            } catch (e) {}

            const val = prompt(
                "Tell Frank what is deliberate — structure, devices, tone, what a sequence is doing and why.\n\n" +
                "He will judge whether it lands on the page, and he will stop suggesting you delete it.\n\n" +
                "Leave this empty to clear it.",
                current
            );
            if (val === null) return;

            try {
                await fetch('/intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: SESSION_ID, text: val })
                });
                addMessage(val.trim()
                    ? "Noted. Your intentions are on file, and I will judge the execution against them rather than against my own preferences."
                    : "Your statement of intent has been cleared.", false);
            } catch (e) {
                addMessage("I could not file that. Try again in a moment.", false);
            }
            refreshStatus();
        }

        async function refreshStatus() {
            const el = document.getElementById('memoryStatus');
            try {
                const r = await fetch('/session?sessionId=' + encodeURIComponent(SESSION_ID));
                const d = await r.json();
                const ib = document.getElementById('intentBtn');
                if (ib) ib.classList.toggle('set', !!d.hasIntent);
                if (d.hasScript) {
                    el.classList.add('loaded');
                    let line = 'ON FILE: ' + (d.title || 'UNTITLED') + ' — DRAFT ' + d.drafts +
                        ' · ' + d.coverageCount + ' PASS' + (d.coverageCount === 1 ? '' : 'ES') + ' REMEMBERED';
                    if (d.settledCount) line += ' · ' + d.settledCount + ' RULING' + (d.settledCount === 1 ? '' : 'S');
                    if (d.hasIntent) line += ' · INTENT ON FILE';
                    el.textContent = line;
                } else {
                    el.classList.remove('loaded');
                    el.textContent = d.hasIntent ? 'No script on file · Intent on file' : 'No script on file';
                }
                return d;
            } catch (e) {
                el.classList.remove('loaded');
                el.textContent = 'Memory unavailable';
                return null;
            }
        }

        function initAudio() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function splitIntoChunks(text, maxChars = 400) {
            const sentences = text.match(/[^.!?]+[.!?]+[\s]*/g) || [text];
            const chunks = [];
            let current = '';
            for (const sentence of sentences) {
                if ((current + sentence).length > maxChars && current.length > 0) {
                    chunks.push(current.trim());
                    current = sentence;
                } else {
                    current += sentence;
                }
            }
            if (current.trim().length > 0) chunks.push(current.trim());
            return chunks;
        }

        // --- SPEECH NORMALIZATION --------------------------------------------
        // The voice engine treats an all-capitals word as an initialism, which is
        // why FRANK'S AUDIT - TV PILOT comes out mangled while the same words read
        // correctly further down in ordinary prose. Headings are lowered to normal
        // case for the voice only; what you see on screen is untouched.
        const SPOKEN_ACRONYMS = new Set([
            'TV','DJ','ID','ICU','ER','MDMA','GHB','LSD','DNA','CEO','HBO','AMC','FX',
            'UK','US','USA','LA','NYC','PA','VHS','CD','MC','AA','NA','OK','PG','DVD','MTV','BBC'
        ]);

        function textForSpeech(text) {
            return text
                .replace(/Logline/gi, 'Log line')
                .replace(/\s*[—–]\s*/g, ', ')          // em dashes read as an abrupt stop
                .replace(/\s+\/\s+/g, ' or ')          // "TV PILOT / EPISODE"
                .replace(/\b[A-Z][A-Z'’]*[A-Z]\b/g, w => {
                    const bare = w.replace(/[^A-Z]/g, '');
                    return SPOKEN_ACRONYMS.has(bare) ? w : w.charAt(0) + w.slice(1).toLowerCase();
                });
        }

        // Fetched once and shared, so the greeting isn't waiting on a round trip.
        let voiceSettingsPromise = null;
        function getVoiceSettings() {
            if (!voiceSettingsPromise) {
                voiceSettingsPromise = fetch('/voice-settings').then(r => r.json());
            }
            return voiceSettingsPromise;
        }
        // instead of leaving the slot empty forever. This is what stops playback from
        // hanging silently partway through.
        async function fetchTTSAudio(text, settings, attempt = 0) {
            try {
                const res = await fetch("https://api.inworld.ai/tts/v1/voice", {
                    method: "POST",
                    headers: { "Authorization": `Basic ${settings.apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ text: textForSpeech(text), voiceId: "default-oglabcjnetcklcq7rghmbw__frank", modelId: "inworld-tts-1.5-max" })
                });
                const data = await res.json();
                if (!data.audioContent) throw new Error('No audioContent in TTS response');
                return await audioCtx.decodeAudioData(
                    Uint8Array.from(atob(data.audioContent), c => c.charCodeAt(0)).buffer
                );
            } catch (e) {
                if (attempt < 3) {
                    await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
                    return fetchTTSAudio(text, settings, attempt + 1);
                }
                console.warn('TTS chunk failed after retries, skipping it:', e);
                return 'FAILED';
            }
        }

        // --- Concurrency-limited chunk loader. Firing every chunk of a long document at
        // the TTS API simultaneously trips its rate limiting, which silently fails a batch
        // of chunks at once (that's what caused big chunks of the middle to get skipped).
        // Only a few requests are in flight at a time here, and playback starts as soon as
        // chunk 0 is ready — same as before, just paced.
        async function loadAudioChunks(chunks, settings, targetBuffers, onFirstReady, concurrency = 3) {
            let cursor = 0;
            let firstReadyFired = false;
            async function worker() {
                while (cursor < chunks.length) {
                    const index = cursor++;
                    targetBuffers[index] = await fetchTTSAudio(chunks[index], settings);
                    if (index === 0 && !firstReadyFired) {
                        firstReadyFired = true;
                        if (onFirstReady) onFirstReady();
                    }
                }
            }
            const workerCount = Math.min(concurrency, chunks.length) || 1;
            await Promise.all(Array.from({ length: workerCount }, () => worker()));
        }

        async function prefetchGreeting(mode) {
            pendingGreetings[mode] = null;
            try {
                const [text, settings] = await Promise.all([
                    fetchGreeting(mode, 'switch'),
                    getVoiceSettings()
                ]);
                const chunks = splitIntoChunks(text);
                const bufferMap = {};
                await loadAudioChunks(chunks, settings, bufferMap, null);
                pendingGreetings[mode] = { text, bufferMap, totalSections: chunks.length };
            } catch(e) {}
        }

        let recognition = null;
        let currentTranscript = '';
        let micActive = false;

        function initSpeechRecognition() {
            const micBtn = document.getElementById('micBtn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { micBtn.classList.add('unavailable'); micBtn.title = "Voice input not supported in this browser"; return; }
            try {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let interimTranscript = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        if (e.results[i].isFinal) currentTranscript += e.results[i][0].transcript + ' ';
                        else interimTranscript += e.results[i][0].transcript;
                    }
                    textInput.value = currentTranscript + interimTranscript;
                };
                recognition.onerror = (e) => {
                    micActive = false; micBtn.classList.remove('recording');
                    if (e.error === 'not-allowed') { micBtn.classList.add('unavailable'); micBtn.title = "Microphone access denied"; }
                };
                recognition.onend = () => { if (micActive) { micActive = false; micBtn.classList.remove('recording'); } };
            } catch(e) { micBtn.classList.add('unavailable'); }
        }

        function toggleMic() {
            const micBtn = document.getElementById('micBtn');
            if (micBtn.classList.contains('unavailable')) return;
            if (!recognition) return;
            if (micActive) {
                recognition.stop(); micActive = false; micBtn.classList.remove('recording');
            } else {
                currentTranscript = textInput.value ? textInput.value.trim() + ' ' : '';
                textInput.value = currentTranscript;
                micActive = true; 
                micBtn.classList.add('recording');
                try { recognition.start(); } catch(e) { micActive = false; micBtn.classList.remove('recording'); }
            }
        }

        document.getElementById('modeToggle').addEventListener('change', async function() {
            const mode = this.checked ? 'tv' : 'feature';
            const nextMode = this.checked ? 'feature' : 'tv';

            const ready = pendingGreetings[mode];
            pendingGreetings[mode] = null;

            if (ready) {
                addMessage(ready.text);
                stopCurrentAudio();
                audioBuffers = ready.bufferMap;
                totalSections = ready.totalSections;
                nextToPlay = 0;
                waitStartTime = null;
                isSequenceActive = true;
                audioCtx.resume().then(() => playSequentially());
            } else {
                const holder = addMessage('...');
                const text = await fetchGreeting(mode, 'switch');
                holder.innerText = text;
                chatWindow.scrollTop = chatWindow.scrollHeight;
                speak(text);
            }

            prefetchGreeting(nextMode);
        });

        async function preWarmGreeting(text) {
            try {
                const settings = await getVoiceSettings();
                const parts = splitIntoChunks(text);
                totalSections = parts.length;
                nextToPlay = 0;
                waitStartTime = null;
                isSequenceActive = true;
                loadAudioChunks(parts, settings, audioBuffers, () => {
                    if (!isPlaying) audioCtx.resume().then(() => playSequentially());
                });
            } catch (e) {}
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('scriptInput');
            if (fileInput.files.length === 0) return;
            addMessage('Analyzing... This takes a few moments, darling...', false);
            const mode = document.getElementById('modeToggle').checked ? 'T.V. Series' : 'Feature Film';
            const formData = new FormData();
            formData.append('mode', mode);
            formData.append('sessionId', SESSION_ID);
            formData.append('scripts', fileInput.files[0]);
            const response = await fetch('/analyze', { method: 'POST', body: formData });
            const data = await response.json();
            addMessage(data.message);
            speak(data.message);
            refreshStatus();
            fileInput.value = '';
        }

        async function speak(fullText) {
            if (!audioCtx) return;

            stopCurrentAudio();

            const rawSections = fullText.split(/(?<=\. |\n)/g);
            const chunks = [];
            for (const section of rawSections) {
                if (section.trim().length < 2) continue;
                if (section.length > 400) {
                    chunks.push(...splitIntoChunks(section));
                } else {
                    chunks.push(section.trim());
                }
            }
            audioBuffers = {}; nextToPlay = 0; waitStartTime = null;
            totalSections = chunks.length;
            isSequenceActive = true;
            const settings = await getVoiceSettings();
            loadAudioChunks(chunks, settings, audioBuffers, () => {
                if (!isPlaying && isSequenceActive) playSequentially();
            });
        }

        function playSequentially() {
            if (!isSequenceActive || nextToPlay >= totalSections) { isPlaying = false; return; }

            const buf = audioBuffers[nextToPlay];

            // Chunk permanently failed after retries — skip it immediately, don't stall.
            if (buf === 'FAILED') {
                nextToPlay++;
                waitStartTime = null;
                playSequentially();
                return;
            }

            if (buf) {
                waitStartTime = null;
                isPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = buf;
                currentSource.connect(audioCtx.destination);
                currentSource.onended = () => { if (isSequenceActive) { nextToPlay++; playSequentially(); } };
                currentSource.start();
                return;
            }

            // Buffer not ready yet — keep polling, but don't wait forever.
            if (waitStartTime === null) waitStartTime = Date.now();
            if (Date.now() - waitStartTime > CHUNK_STALL_TIMEOUT_MS) {
                console.warn('Timed out waiting for audio chunk ' + nextToPlay + ', skipping it.');
                nextToPlay++;
                waitStartTime = null;
                playSequentially();
            } else if (isSequenceActive) {
                setTimeout(playSequentially, 50);
            }
        }

        function stopCurrentAudio() {
            isSequenceActive = false; isPlaying = false; waitStartTime = null;
            if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
        }

        function togglePlayback() {
            if (isPlaying) stopCurrentAudio();
            else { isSequenceActive = true; playSequentially(); }
        }

        async function wipeMemory() {
            if (!confirm("This clears the script, all coverage, and this conversation from Frank's files. Continue?")) return;
            stopCurrentAudio();
            audioBuffers = {};
            nextToPlay = 0;
            totalSections = 0;
            try {
                const response = await fetch('/clear-memory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: SESSION_ID })
                });
                const data = await response.json();
                addMessage(data.message, false);
                speak(data.message);
            } catch (e) {
                const fallbackMsg = "Memory wiped, darling.";
                addMessage(fallbackMsg, false);
                speak(fallbackMsg);
            }
            refreshStatus();
        }

        function sendBanter() {
            const val = textInput.value.trim();
            if (!val) return;
            textInput.value = '';
            currentTranscript = '';
            addMessage(val, true);
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: val, sessionId: SESSION_ID })
            })
                .then(r => r.json())
                .then(data => { addMessage(data.message); speak(data.message); });
        }

        function addMessage(text, user = false) {
            const div = document.createElement('div');
            div.className = user ? 'msg user-msg' : 'msg';
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        function downloadPDF() {
            const element = document.createElement('div');
            element.innerHTML = `<div style="padding:40px; background:#000; color:#fff; font-family:serif; line-height:1.6;">
                <h1 style="color:#d4af37; border-bottom:2px solid #d4af37;">FRANK'S PRIVATE AUDIT</h1>
                ${Array.from(document.querySelectorAll('.msg:not(.user-msg)')).map(m =>
                    `<p style="margin-bottom:20px; white-space:pre-wrap; border-left:3px solid #d4af37; padding-left:15px;">${m.innerText}</p>`
                ).join('')}
            </div>`;
            html2pdf().from(element).save('Frank_Audit.pdf');
        }
    </script>
</body>
</html>
